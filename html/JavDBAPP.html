  <style>
    :root {
      color-scheme: dark;
      --text: #e8edf5;
      --muted: rgba(190, 200, 220, .70);
      --panel: rgba(34, 44, 62, .72);
      --panel-2: rgba(42, 54, 76, .86);
      --panel-strong: rgba(22, 30, 44, .96);
      --line: rgba(255, 255, 255, .12);
      --accent: #2f80ed;
      --accent-2: #4d8df0;
      --accent-soft: rgba(47, 128, 237, .18);
      --gold: #f0b429;
      --ok: #37d0a0;
      --magnet: #3aa0ff;
      --radius: 12px;
      --safe-top: 0px; --safe-right: 0px; --safe-bottom: 0px; --safe-left: 0px;
      --fm-web-h: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    }
    :root { --safe-top: var(--fm-safe-top, 0px); --safe-bottom: var(--fm-safe-bottom, 0px); --safe-left: var(--fm-safe-left, 0px); --safe-right: var(--fm-safe-right, 0px); }
    @supports (top: max(0px, 1px)) {
      :root {
        --safe-top: max(var(--fm-safe-top, 0px), env(safe-area-inset-top, 0px));
        --safe-bottom: max(var(--fm-safe-bottom, 0px), env(safe-area-inset-bottom, 0px));
        --safe-left: max(var(--fm-safe-left, 0px), env(safe-area-inset-left, 0px));
        --safe-right: max(var(--fm-safe-right, 0px), env(safe-area-inset-right, 0px));
      }
    }
    @supports (height: 100dvh) { :root { --fm-web-h: 100dvh; } }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; max-width: 100%;
      min-height: var(--fm-web-h);
      background: transparent; color: var(--text);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    html:not(.fm-native) body { background: #1d2737; }
    html.fm-native body { background: transparent; }
    body { position: relative; }
    body::before {
      content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -2; pointer-events: none;
      background:
        radial-gradient(80% 46% at 82% -6%, rgba(47, 128, 237, .26), transparent 60%),
        radial-gradient(70% 44% at 8% 2%, rgba(100, 70, 230, .20), transparent 58%),
        linear-gradient(170deg, #243149 0%, #1e293c 45%, #182232 100%);
    }
    button, input { font: inherit; color: inherit; }
    button { border: 0; cursor: pointer; touch-action: manipulation; margin: 0; padding: 0; appearance: none; -webkit-appearance: none; background: transparent; text-align: inherit; }
    img { display: block; max-width: 100%; border: 0; background: transparent; }
    a { color: inherit; text-decoration: none; }

    .app { width: 100%; max-width: 100%; min-width: 0; min-height: var(--fm-web-h); overflow-x: hidden;
      padding: 0 0 calc(24px + var(--safe-bottom)); }
    body.detail-active .app { visibility: hidden; pointer-events: none; }

    .topbar {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; padding-top: calc(var(--safe-top) + 8px);
      padding-left: calc(var(--safe-left) + 12px); padding-right: calc(var(--safe-right) + 12px);
      background: rgba(12, 17, 28, .62); border-bottom: 1px solid rgba(47, 128, 237, .18);
    }
    @supports (backdrop-filter: blur(2px)) {
      .topbar { -webkit-backdrop-filter: blur(16px) saturate(1.25); backdrop-filter: blur(16px) saturate(1.25); background: rgba(12, 17, 28, .45); }
    }
    .brand { display: inline-flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 800; letter-spacing: .02em; color: #fff; line-height: 1; }
    .brand .dot { width: 10px; height: 10px; border-radius: 3px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 0 10px rgba(47, 128, 237, .7); }
    .login-btn {
      margin-left: auto; flex: 0 0 auto;
      min-height: 34px; padding: 0 12px; border-radius: 999px;
      background: var(--accent-soft); border: 1px solid rgba(47, 128, 237, .5); color: #cfe3ff;
      font-size: 12px; font-weight: 700; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .login-btn.on { color: #fff; background: rgba(55, 208, 160, .18); border-color: rgba(55, 208, 160, .5); }
    .login-btn:focus { outline: 2px solid var(--accent-2); outline-offset: 1px; }

    .search-wrap { padding: 10px 12px 2px; padding-left: calc(var(--safe-left) + 12px); padding-right: calc(var(--safe-right) + 12px); }
    .search-bar { display: flex; gap: 8px; }
    .search-bar .field { flex: 1 1 auto; min-width: 0; }
    .field {
      width: 100%; min-height: 42px; border-radius: 999px;
      border: 1.5px solid transparent; outline: none; font-size: 14px; color: var(--text);
      padding: 0 16px;
      background-image: linear-gradient(var(--panel-2), var(--panel-2)), linear-gradient(120deg, var(--accent), var(--accent-2));
      background-origin: border-box; background-clip: padding-box, border-box;
    }
    .field::placeholder { color: rgba(188, 198, 218, .5); }
    .field:focus { box-shadow: 0 0 0 3px rgba(47, 128, 237, .25); }
    .icon-btn { flex: 0 0 auto; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); }
    .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .icon-btn:focus { outline: 2px solid var(--accent-2); outline-offset: 1px; }

    .chips { display: flex; gap: 7px; overflow-x: auto; padding: 8px 12px 2px; padding-left: calc(var(--safe-left) + 12px); padding-right: calc(var(--safe-right) + 12px); overscroll-behavior-x: contain; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: 0 0 auto; min-height: 32px; padding: 0 13px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .chip.active { background: linear-gradient(120deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; }
    .chip:focus { outline: 2px solid var(--accent-2); outline-offset: 1px; }

    .section { width: 100%; max-width: 100%; min-width: 0; margin-top: 14px; padding: 0 12px; padding-left: calc(var(--safe-left) + 12px); padding-right: calc(var(--safe-right) + 12px); }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .section-head h3 { margin: 0; font-size: 16px; line-height: 1.25; }
    .section-head span { color: var(--muted); font-size: 12px; white-space: nowrap; }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    .fm-tv .grid { grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .card { position: relative; text-align: left; color: var(--text); }
    .card-inner { border-radius: var(--radius); overflow: hidden; background: var(--panel); border: 1px solid var(--line); transition: transform .12s ease, border-color .12s ease; }
    .card:focus, .card:focus-within { outline: none; }
    .card:focus .card-inner { border-color: var(--accent-2); box-shadow: 0 0 0 2px rgba(47, 128, 237, .55); transform: translateY(-2px); }
    .poster { position: relative; width: 100%; aspect-ratio: 2 / 3; background: #0b0f1a; overflow: hidden; }
    .no-aspect-ratio .poster { height: auto; min-height: 120px; }
    .poster img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .no-aspect-ratio .poster img { position: static; width: 100%; height: auto; }
    .rating-badge { position: absolute; right: 6px; top: 6px; min-width: 30px; height: 20px; display: grid; place-items: center; border-radius: 999px; background: rgba(0, 0, 0, .55); border: 1px solid rgba(255, 255, 255, .2); color: #ffd54d; font-size: 10px; font-weight: 800; line-height: 1; }
    .sub-badge { position: absolute; left: 6px; top: 6px; height: 18px; padding: 0 6px; display: grid; place-items: center; border-radius: 999px; background: rgba(240, 180, 41, .85); color: #1a1400; font-size: 10px; font-weight: 800; line-height: 1; }
    .card-body { padding: 7px 9px 9px; }
    .card-code { font-size: 11px; font-weight: 800; color: var(--accent-2); line-height: 1.2; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-title { font-size: 12px; line-height: 1.35; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.7em; }
    .card-meta { margin-top: 3px; font-size: 11px; color: var(--muted); }
    .empty, .loading { min-height: 90px; display: grid; place-items: center; padding: 18px; border-radius: var(--radius); border: 1px dashed var(--line); color: var(--muted); background: rgba(255, 255, 255, .03); font-size: 13px; text-align: center; grid-column: 1 / -1; }
    .pagination { display: flex; gap: 8px; justify-content: center; align-items: center; padding: 16px 0 4px; }
    .btn { min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 14px; border-radius: var(--radius); background: var(--panel-2); border: 1px solid var(--line); color: var(--text); font-weight: 700; font-size: 13px; }
    .btn.primary { background: linear-gradient(120deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; }
    .btn.small { min-height: 30px; padding: 0 11px; font-size: 12px; }
    .btn:focus { outline: 2px solid var(--accent-2); outline-offset: 1px; }

    .subbar { display: flex; align-items: center; gap: 10px; padding: 4px 12px 0; padding-left: calc(var(--safe-left) + 12px); padding-right: calc(var(--safe-right) + 12px); }

    .sheet { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 90; display: none; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--panel-strong); }
    @supports (backdrop-filter: blur(2px)) { .sheet { -webkit-backdrop-filter: blur(22px) saturate(1.2); backdrop-filter: blur(22px) saturate(1.2); } }
    .sheet.on { display: block; }
    .sheet-hd { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; padding: 10px 12px; padding-top: calc(var(--safe-top) + 10px); padding-left: calc(var(--safe-left) + 12px); padding-right: calc(var(--safe-right) + 12px); background: rgba(12, 17, 28, .6); border-bottom: 1px solid var(--line); }
    .sheet-hd .bk { min-height: 36px; padding: 0 12px; border-radius: var(--radius); background: var(--panel-2); border: 1px solid var(--line); color: var(--text); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
    .sheet-hd .tt { margin-left: 10px; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .detail-body { padding: 0 0 calc(var(--safe-bottom) + 28px); }
    .detail-inner { padding: 12px 14px; padding-left: calc(var(--safe-left) + 14px); padding-right: calc(var(--safe-right) + 14px); }

    .hero { display: flex; gap: 12px; }
    .hero-poster { flex: 0 0 118px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
    .hero-poster img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; background: #0b0f1a; }
    .no-aspect-ratio .hero-poster img { height: auto; min-height: 176px; }
    .hero-info { flex: 1 1 auto; min-width: 0; }
    .hero-code { font-size: 13px; font-weight: 800; color: var(--accent-2); margin-bottom: 4px; }
    .hero-title { font-size: 15px; font-weight: 800; line-height: 1.35; margin: 0 0 8px; }
    .hero-origin { font-size: 12px; color: var(--muted); line-height: 1.4; margin: -4px 0 6px; }
    .hero-meta { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .hero-meta b { color: var(--text); font-weight: 700; }
    .d-play { display: block; width: 100%; margin: 14px 0 8px; padding: 13px 20px; border-radius: 999px; text-align: center; font-size: 15px; font-weight: 800; color: #fff; background: linear-gradient(120deg, var(--accent), var(--accent-2)); box-shadow: 0 8px 22px rgba(47, 128, 237, .32); }
    .d-play:focus { outline: none; box-shadow: 0 0 0 3px rgba(47, 128, 237, .5), 0 8px 22px rgba(47, 128, 237, .4); }
    .d-play:disabled { opacity: .5; }
    .d-play-row { display: flex; gap: 8px; margin: 12px 0 4px; }
    .d-play-row .d-play { margin: 0; flex: 1; }
    .d-play-row .d-play.ghost { flex: 0 0 auto; padding: 13px 18px; background: var(--panel-2); border: 1px solid var(--accent-2); color: var(--accent-2); box-shadow: none; }

    .info-list { margin: 14px 0 0; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
    .info-row { display: flex; gap: 10px; padding: 10px 12px; border-bottom: 1px solid rgba(255, 255, 255, .06); }
    .info-row:last-child { border-bottom: 0; }
    .info-row .k { flex: 0 0 64px; color: var(--muted); font-size: 12px; }
    .info-row .v { flex: 1 1 auto; min-width: 0; font-size: 13px; line-height: 1.5; word-break: break-all; }
    .info-row .v button.link { color: var(--accent-2); font-size: 13px; display: inline; }

    .d-sec { font-size: 13px; font-weight: 800; color: var(--text); margin: 16px 2px 8px; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip-row .tchip { display: inline-block; padding: 6px 12px; border-radius: 999px; font-size: 12px; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); }
    .chip-row .tchip.who { color: var(--accent-2); border-color: rgba(47, 128, 237, .4); }
    .chip-row .tchip:focus { outline: 2px solid var(--accent-2); }
    .avatar-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .avatar-row .avatar { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 66px; text-align: center; }
    .avatar-row .avatar .ava-img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: #0b0f1a; border: 1px solid var(--line); }
    .avatar-row .avatar .ava-name { font-size: 11px; line-height: 1.3; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .d-desc { font-size: 13px; line-height: 1.7; color: var(--muted); white-space: pre-wrap; word-break: break-word; }

    .fold { margin-top: 16px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
    .fold-hd { width: 100%; display: flex; align-items: center; gap: 8px; padding: 12px 14px; font-size: 13px; font-weight: 800; color: var(--text); }
    .fold-hd:focus { outline: 2px solid var(--accent-2); outline-offset: -2px; }
    .fold-arrow { display: inline-block; color: var(--muted); font-size: 12px; transition: transform .2s ease; }
    .fold-count { color: var(--muted); font-weight: 600; font-size: 12px; }

    .fold-bd::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .22); border-radius: 2px; }
    .fold.open .fold-bd { display: block; }

    .magnet-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); margin-bottom: 8px; }
    .magnet-info { flex: 1 1 auto; min-width: 0; }

    .magnet-play:focus { outline: 2px solid #fff; outline-offset: 1px; }

    .sample-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .sample-grid img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: #0b0f1a; }

        var keys = ["url", "play_url", "video_url", "stream_url", "m3u8_url", "hls_url", "link", "src", "file"];
        for (var j = 0; j < keys.length; j++) { if (v[keys[j]] !== undefined) { var u2 = pickUrl(v[keys[j]]); if (u2) return u2; } }
        for (var k in v) { if (Object.prototype.hasOwnProperty.call(v, k)) { var u3 = pickUrl(v[k]); if (u3) return u3; } }
      }
      return "";
    }
    function isSub(x) {
      return !!(x && (x.is_subtitle === true || x.has_subtitle === true || x.subtitle === true || x.is_cnsub === true || x.has_cnsub === true || x.cnsub === true || Number(x.cnsub) > 0));

    /* ================= URL 构造 ================= */

    function proxyHint(m) {
      var s = String(m || "");
      if (/\[::\]|failed to connect|unable to resolve|not resolve|no address|enotfound|unknownhost|econnrefused|network is unreachable|timed? ?out|socket/i.test(s)) {
        return "jdforrepam.com（数据接口）连不上，通常是 DNS 被污染或域名被屏蔽。可到「设置 → 增强功能 → Proxy 壳代理」给 jdforrepam.com、c0.jdbstatic.com 配置代理（代理自己做 DNS，最稳），或开 VPN 后重试";
      }
      if (/403|429|forbidden|blocked/i.test(s)) {
        return "请求被拦截（HTTP 403/429），可能是节点被限流。可在「设置 → 增强功能 → Proxy 壳代理」配置代理换节点后重试";
      }
      return "";
    }
    function friendlyError(msg) {
      var m = String(msg || "网络错误");
      var h = proxyHint(m);
      return h ? (m + "。" + h) : m;
    }
    function showError(msg) {
      var g = $("videoGrid"); g.className = "grid"; g.replaceChildren();
      var e = document.createElement("div"); e.className = "empty"; e.textContent = friendlyError(msg || "网络错误，请重试"); g.appendChild(e);

    function catLabel() {

    async function loadList() {
      if (state.isLoading) return;
      state.isLoading = true;
      showLoading();
      try {
        if (state.query) {
          var sd = await apiGet("/api/v2/search", { q: state.query, page: state.page, type: "movie", movie_type: "all", movie_sort_by: "relevance", movie_filter_by: "all" }, false);
          var items = extractMovies(sd);
          $("sectionTitle").textContent = "搜索：" + state.query;
          renderGrid(items);
          $("sectionCount").textContent = items.length ? items.length + " 条" : "";
          renderPagination(items.length >= PAGE_SIZE);
        } else {
          var req = buildListReq();
          var data = await apiGet(req.path, req.params, !!req.auth);
          var movies = extractMovies(data);
          $("sectionTitle").textContent = catLabel();
          renderGrid(movies);
          $("sectionCount").textContent = movies.length ? movies.length + " 条" : "";
          renderPagination(movies.length >= PAGE_SIZE);
        }
      } catch (e) {
        var msg = String(e.message || e);
        log("loadList error", e);
        if (/请先登录|鉴权|Unauthorized|token/i.test(msg) && (state.cat === "top" || state.query)) showError("需要登录后查看，请先登录");
        else showError("加载失败：" + msg);
      } finally {
        state.isLoading = false;
      }
    }
    async function loadListing() {
      if (state.isLoading || !state.listing) return;
      state.isLoading = true;
      showLoading();
      try {
        var params = {};
        for (var k in state.listing.params) if (Object.prototype.hasOwnProperty.call(state.listing.params, k)) params[k] = state.listing.params[k];
        params.page = state.page;
        params.limit = PAGE_SIZE;
        var data = await apiGet(state.listing.path, params, false);
        var movies = extractMovies(data);
        $("sectionTitle").textContent = state.listing.title;
        renderGrid(movies);
        $("sectionCount").textContent = movies.length ? movies.length + " 条" : "";
        renderPagination(movies.length >= PAGE_SIZE);
      } catch (e) {
        showError("加载失败：" + String(e.message || e));
      } finally {
        state.isLoading = false;
      }
    }
    async function loadEntity() {
      if (state.isLoading || !state.entity) return;
      state.isLoading = true;
      showLoading();
      try {
        var e = ENTITY[state.entity.type];
        var data = await apiGet(e.path + encodeURIComponent(state.entity.id), null, state.loggedIn);
        var root = data[e.key] || data || {};
        var name = cleanText(root.name || root.name_zht || root.other_name || root.title || state.entity.name || e.label);
        var etype = String(root.type != null ? root.type : "0");
        var sp = state.sort.split(" ");
        var params = { filter_by: etype + ":" + e.letter + ":" + state.entity.id + ":", sort_by: sp[0], order_by: sp[1] || "desc" };
        var p2 = { page: state.page, limit: PAGE_SIZE };
        for (var pk in params) { if (Object.prototype.hasOwnProperty.call(params, pk)) p2[pk] = params[pk]; }
        var mr = await apiGet("/api/v1/movies/tags", p2, false);
        var movies = extractMovies(mr);
        $("sectionTitle").textContent = name;
        var countEl = $("sectionCount");
        var meta = [];
        if (root.videos_count != null) meta.push("作品 " + root.videos_count);
        if (root.age) meta.push(root.age + " 岁");
        if (root.height) meta.push("身高 " + root.height);
        countEl.textContent = meta.join(" · ");
        renderGrid(movies);
        renderPagination(movies.length >= PAGE_SIZE);
      } catch (e2) {
        showError("加载失败：" + String(e2.message || e2));
      } finally {
        state.isLoading = false;
      }
    }
    function reload() {
      if (state.mode === "entity") loadEntity();
      else if (state.mode === "listing") loadListing();
      else loadList();
    }

    function foldSection(title, bodyId, countId) {

          b.className = "tchip"; b.tabIndex = 0;
          b.textContent = "📁 " + cleanText(l.name || "未命名清单") + (l.movies_count != null ? " (" + l.movies_count + ")" : "");
          b.addEventListener("click", function () { openListing(cleanText(l.name || "清单"), { filter_by: "0:l:" + String(l.id) + ":" }); });
          wrap.appendChild(b);
        });
      } catch (e) {
        if (wrap) { wrap.replaceChildren(); var err = document.createElement("span"); err.textContent = friendlyError("相关清单加载失败：" + String(e.message || e)); err.style.cssText = "color:var(--muted);font-size:12px;"; wrap.appendChild(err); }
      }
    }

    /* ================= 播放 ================= */
    function playStream(url, title, pic) {
      var fm = sdk();
      if (!fm) { toast("请在 App 内打开"); return; }
      var picUrl = pic ? resImg(pic) : "";
      var hdr = { "User-Agent": UA_WEB, Referer: WEB_HOST + "/" };
      if (fm.vodInline) {
        try {
          window.__fmWebHomeInlineResolver = function () { return { url: url, format: "application/x-mpegURL", headers: hdr }; };
          fm.vodInline({ vod_id: "javdb_" + (title || Date.now()), vod_name: title || "JavDB", vod_pic: picUrl, wallPic: "", vod_play_from: "在线", mark: "在线", headers: hdr, episodes: [{ name: "在线播放", url: url, resolve: true }] });
          toast("已开始播放"); return;
        } catch (e) { log("vodInline error", e); }
      }
      if (fm.play) {
        try { fm.play(url, title || "", { pic: picUrl, wallPic: "", format: "hls", headers: hdr }); toast("已开始播放"); return; }
        catch (e) { log("fm.play error", e); }
      }
      if (fm.pan && fm.pan.play) {
        try { fm.pan.play({ type: "http", url: url, title: title || "", pic: picUrl, wallPic: "" }); toast("已推送到播放器"); return; } catch (e2) {}
      }
      toast("播放失败：当前版本不支持");
    }
    function playMagnet(url, title, pic) {
      var fm = sdk();
      if (!fm) { toast("请在 App 内打开"); return; }
      if (fm.pan && fm.pan.play) {
        toast("正在打开播放器…");
        var payload = { type: "magnet", url: url, title: title || "" };
        try {
          var p = fm.pan.play(payload);
          if (p && p.then) {
            p.then(function () {}, function () { toast("播放失败，磁力可能已失效"); });
          }
        } catch (e) { toast("播放失败：" + (e.message || "")); }
      } else { toast("当前版本不支持磁力播放"); }
    }
    async function handlePlay(d) {
      if (!state.loggedIn) { toast("请先登录后播放"); openLogin(); return; }
      var sources = d.playSources || [];
      if (!sources.length) { toast("该片暂无播放线路"); return; }
      toast("获取播放地址…");
      var lastErr = "";
      for (var i = 0; i < sources.length; i++) {
        try {
          var data = await apiGet("/api/v1/movies/" + encodeURIComponent(d.id) + "/play", { source_id: sources[i].id, from_rankings: "false", operation: "play" }, true);
          var u = pickUrl(data);
          if (u) { playStream(u, d.title || d.number, d.cover); return; }
          lastErr = "未解析到直链";
        } catch (e) { lastErr = String(e.message || e); }
      }
      toast("播放失败：" + lastErr);
    }

    /* ================= 详情开关 ================= */
    async function openDetail(id) {
      state.detailId = id;
      state.routeToken++;
      var token0 = state.routeToken;
      try { history.pushState({ type: "detail", id: id }, "", "#detail=" + id); } catch (e) {}
      document.body.classList.add("detail-active");
      $("detailSheet").classList.add("on");
      $("detailSheet").scrollTop = 0;
      $("detailHeadTitle").textContent = "加载中…";
      var container = $("detailContent");
      container.replaceChildren();
      var loading = document.createElement("div"); loading.className = "loading"; loading.textContent = "加载详情…";
      container.appendChild(loading);

      try {
        var data = await apiGet("/api/v4/movies/" + encodeURIComponent(id), null, state.loggedIn);
        if (token0 !== state.routeToken) return;
        var x = data.movie || data || {};
        var m = movieObj(x);
        var actors = (x.actors || []).map(function (a) { return { name: cleanText(a.name || a.name_zht || ""), id: a.id, avatar: a.avatar_url || "" }; }).filter(function (a) { return a.name; });
        var tags = (x.tags || []).map(function (t) { return { name: cleanText(typeof t === "string" ? t : (t.name || t.title || "")), id: (typeof t === "object" && t) ? t.id : "" }; }).filter(function (t) { return t.name; });
        var playSources = [];
        if (Array.isArray(x.play_sources)) {
          x.play_sources.forEach(function (s, idx) {
            if (typeof s === "object") {
              playSources.push({ id: String(s.id != null ? s.id : (s.source_id != null ? s.source_id : (s.value != null ? s.value : (idx + 1)))), name: cleanText(s.name || s.title || s.label || ("线路 " + (idx + 1))) });
            } else {
              playSources.push({ id: String(s), name: "线路 " + (idx + 1) });
            }
          });
        }
        var previewImages = (x.preview_images || []).map(function (p) { return typeof p === "string" ? p : (p.large_url || p.thumb_url || p.url || ""); }).filter(Boolean);
        var d = {
          id: m.id, number: m.number, title: m.title, origin: cleanText(x.origin_title || ""),
          cover: m.cover, score: m.score, date: m.date, duration: m.duration, magnets: m.magnets,
          canPlay: m.canPlay, previewVideoUrl: x.preview_video_url || "",
          maker: cleanText(x.maker_name || (x.maker && x.maker.name) || ""), makerId: String(x.maker_id || (x.maker && x.maker.id) || ""),
          publisher: cleanText(x.publisher_name || ""), publisherId: String(x.publisher_id || ""),
          series: cleanText(x.series_name || (x.series && x.series.name) || ""), seriesId: String(x.series_id || (x.series && x.series.id) || ""),
          director: cleanText(x.director_name || (x.director && x.director.name) || ""), directorId: String(x.director_id || (x.director && x.director.id) || ""),
          desc: cleanText(x.summary || x.description || x.storyline || ""),
          actors: actors, tags: tags, playSources: playSources,
          previewImages: previewImages,
          related: x.relative_movies || [],
          actorMovies: x.actor_movies || []
        };
        $("detailHeadTitle").textContent = d.number || d.title || id;
        renderDetail(d);
      } catch (e) {
        if (token0 !== state.routeToken) return;
        log("fetchDetail error", e);
        container.replaceChildren();
        var err = document.createElement("div"); err.className = "empty"; err.textContent = friendlyError("加载失败：" + String(e.message || e));
        container.appendChild(err);
      }
    }
    function closeDetail() {
      document.body.classList.remove("detail-active");
      $("detailSheet").classList.remove("on");
      state.detailId = null;
      try { if (location.hash.indexOf("detail=") === 1) history.replaceState({ type: "home" }, "", "#"); } catch (e) {}
    }

    /* ================= 二级列表 / 实体详情 ================= */
    function openListing(title, params) {
      state.mode = "listing";
      state.listing = { title: title, path: "/api/v1/movies/tags", params: params };
      state.entity = null;
      state.page = 1;
      closeDetail();
      scrollTop();
      renderAllChips();
      renderSubBar();
      loadListing();
    }
    function openEntity(type, id, name) {
      state.mode = "entity";
      state.entity = { type: type, id: String(id || ""), name: name };
      state.listing = null;
      state.page = 1;
      closeDetail();
      scrollTop();
      renderAllChips();
      renderSubBar();
      loadEntity();
    }
    function backToHome() {
      state.mode = "list";
      state.listing = null;
      state.entity = null;
      state.page = 1;
      renderSubBar();
      renderAllChips();
      loadList();
    }
    function renderSubBar() {
      var bar = $("subBar");
      var title = "";
      if (state.mode === "entity" && state.entity) title = (ENTITY[state.entity.type] ? ENTITY[state.entity.type].label + " · " : "") + state.entity.name;
      else if (state.mode === "listing" && state.listing) title = state.listing.title;
      if (title) {
        bar.style.display = "";
        bar.replaceChildren();
        var b = document.createElement("button");
        b.className = "btn small"; b.tabIndex = 0; b.textContent = "← 返回";
        b.addEventListener("click", backToHome);
        var t = document.createElement("span"); t.style.cssText = "font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;";
        t.textContent = title;
        bar.appendChild(b); bar.appendChild(t);
      } else {
        bar.style.display = "none"; bar.replaceChildren();
      }
    }

    /* ================= chips ================= */
    function renderCategoryChips() {
      var c = $("categoryChips");
      c.replaceChildren();
      CATEGORIES.forEach(function (cat) {
        var b = document.createElement("button");
        b.className = "chip" + (cat.id === state.cat && state.mode === "list" ? " active" : "");
        b.textContent = cat.label; b.tabIndex = 0; b.setAttribute("data-fm-key", "cat-" + cat.id);
        b.addEventListener("click", function () {
          state.cat = cat.id; state.filter = ""; state.page = 1; state.query = "";
          state.mode = "list"; state.listing = null; state.entity = null;
          $("searchInput").value = "";
          renderAllChips(); renderSubBar();
          if (cat.id === "top" && !state.loggedIn) { toast("TOP250 需登录，请先登录"); openLogin(); }
          else loadList();
        });
        c.appendChild(b);
      });
    }
    function renderFilterChips() {
      var c = $("filterChips");
      c.replaceChildren();
      if (state.mode !== "list" || !isCats()) return;
      FILTERS.forEach(function (f) {
        var b = document.createElement("button");
        b.className = "chip" + (f.id === state.filter ? " active" : "");
        b.textContent = f.label; b.tabIndex = 0;
        b.addEventListener("click", function () { state.filter = f.id; state.page = 1; renderFilterChips(); loadList(); });
        c.appendChild(b);
      });
    }
    function renderSortChips() {
      var c = $("sortChips");
      c.replaceChildren();
      var showSort = state.mode === "list" && (isCats() || state.query);
      if (!showSort) return;
      SORTS.forEach(function (s) {
        var b = document.createElement("button");
        b.className = "chip" + (s.id === state.sort ? " active" : "");
        b.textContent = s.label; b.tabIndex = 0;
        b.addEventListener("click", function () { state.sort = s.id; state.page = 1; renderSortChips(); reload(); });
        c.appendChild(b);
      });
    }
    function renderAllChips() {
      renderCategoryChips();
      renderFilterChips();
      renderSortChips();
    }

    /* ================= 搜索 ================= */
    function doSearch() {
      var q = cleanText($("searchInput").value);
      state.query = q;
      state.page = 1;
      state.mode = "list"; state.listing = null; state.entity = null;
      state.cat = "recommend"; state.filter = "";
      renderAllChips(); renderSubBar();
      loadList();
    }

    /* ================= 初始化 ================= */
    function detectTV() {
      if ((window.fongmiClient && window.fongmiClient.isLeanback) || (window.innerWidth > 960 && window.innerWidth / window.innerHeight > 1.3)) {
        document.documentElement.classList.add("fm-tv");
      }
    }
    function setupUI() {
      renderAllChips();

      $("searchInput").addEventListener("keydown", function (e) { if (e.key === "Enter" || e.keyCode === 13) { e.preventDefault(); this.blur(); doSearch(); } });
      $("searchBtn").addEventListener("click", doSearch);

      $("detailBack").addEventListener("click", closeDetail);
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" || e.key === "Backspace" || e.key === "GoBack") {
          if (document.body.classList.contains("detail-active")) { e.preventDefault(); closeDetail(); }
        }
      });
      window.addEventListener("popstate", function () {
        if (document.body.classList.contains("detail-active")) closeDetail();
      });

      $("loginBtn").addEventListener("click", function () { openLogin(); });
      $("loginCancel").addEventListener("click", closeLogin);
      $("loginSubmit").addEventListener("click", submitLogin);
      $("loginOverlay").addEventListener("click", function (e) { if (e.target === $("loginOverlay")) closeLogin(); });

      loadList();
    }
    async function submitLogin() {
      var btn = $("loginSubmit");
      btn.disabled = true;
      setLoginStatus("登录中…");
      try {
        await doLogin();
        setLoginStatus("登录成功", "ok");
        toast("登录成功");
        setTimeout(closeLogin, 600);
        if (state.detailId) openDetail(state.detailId);
        else reload();
      } catch (e) {
        setLoginStatus("登录失败：" + String(e.message || e), "err");
        log("login error", e);
      } finally {
        btn.disabled = false;
      }
    }
    async function init() {
      detectTV();
      if (window.fongmiBridge) document.documentElement.classList.add("fm-native");
      var start = function () { afterSdk(!!window.fm); };
      if (window.fm) { start(); return; }
      if (!window.fongmiBridge) { start(); return; }
      var done = false;
      function finish() { if (done) return; done = true; window.removeEventListener("fmsdk", finish); start(); }
      window.addEventListener("fmsdk", finish);
      setTimeout(finish, 2000);
    }
    async function afterSdk(ready) {
      log("SDK ready:", ready);
      if (ready && sdk() && sdk().ui && sdk().ui.setChrome) {
        try { sdk().ui.setChrome({ mode: "edge", statusBarStyle: "light", navigationBarStyle: "light", startup: true }); } catch (e) {}
      }
      var tk = await storeGet("token");
      if (tk) token = tk;
      var lg = await storeGet("loggedIn");
      if (lg === "1" && token) setLoggedIn(true);
      if (location.hash && location.hash.indexOf("detail=") === 1) {
        var id = location.hash.split("detail=")[1].split("&")[0];
        if (id) { openDetail(decodeURIComponent(id)); return; }
      }
      setupUI();
    }

    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  })();
  </script>
</body>
</html>
